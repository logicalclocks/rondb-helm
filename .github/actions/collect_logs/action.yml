name: 'Collect Kubernetes cluster logs'
description: 'Reusable action to collect logs and any other relevant information from a Kubernetes cluster'
inputs:
  namespace:
    description: 'Namespace to collect logs from'
    required: true
  folder_name:
    description: 'The number of the current run'
    default: "k8s_logs"
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set config
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}
        printf "Collecting Kubernetes diagnostics for namespace %s\n" "${{ inputs.namespace }}" > ${{ inputs.folder_name }}/summary.txt

    - name: List Pods
      shell: bash
      run: kubectl get pods -n ${{ inputs.namespace }} -o wide > ${{ inputs.folder_name }}/pods.txt 2>&1 || true

    - name: List all
      shell: bash
      run: kubectl get all -n ${{ inputs.namespace }} -o wide > ${{ inputs.folder_name }}/all.txt 2>&1 || true

    - name: Save events
      shell: bash
      run: kubectl get events -n ${{ inputs.namespace }} --sort-by='.metadata.creationTimestamp' > ${{ inputs.folder_name }}/all_events.txt 2>&1 || true

    - name: Describe top
      shell: bash
      run: kubectl top pods -n ${{ inputs.namespace }} > ${{ inputs.folder_name }}/top.txt 2>&1 || true

    - name: Get nodes
      shell: bash
      run: |
        kubectl get nodes -o wide > ${{ inputs.folder_name }}/nodes.txt 2>&1 || true
        kubectl top nodes >> ${{ inputs.folder_name }}/nodes.txt 2>&1 || true

    - name: Describe Deployments
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/deployments
        kubectl get deployments -n ${{ inputs.namespace }} -o wide > ${{ inputs.folder_name }}/deployments.txt 2>&1 || true
        for dep in $(kubectl get deployments -n ${{ inputs.namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
          kubectl describe deployment -n ${{ inputs.namespace }} $dep > ${{ inputs.folder_name }}/deployments/$dep.txt 2>&1 || true
        done

    - name: Describe StatefulSets
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/statefulsets
        kubectl get statefulsets -n ${{ inputs.namespace }} -o wide > ${{ inputs.folder_name }}/statefulsets.txt 2>&1 || true
        for sts in $(kubectl get statefulsets -n ${{ inputs.namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
          kubectl describe statefulset -n ${{ inputs.namespace }} $sts > ${{ inputs.folder_name }}/statefulsets/$sts.txt 2>&1 || true
        done

    - name: Pod logs
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/pods/logs
        for pod in $(kubectl get pods -n ${{ inputs.namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
          mkdir -p ${{ inputs.folder_name }}/pods/logs/$pod
          for container in $(kubectl get pod -n ${{ inputs.namespace }} $pod -o jsonpath='{.spec.containers[*].name}' 2>/dev/null || true); do
            kubectl logs -n ${{ inputs.namespace }} $pod -c $container > ${{ inputs.folder_name }}/pods/logs/$pod/$container.log 2>&1 || true
            kubectl logs -n ${{ inputs.namespace }} $pod -c $container --previous > ${{ inputs.folder_name }}/pods/logs/$pod/$container.previous.log 2>&1 || true
          done
          for container in $(kubectl get pod -n ${{ inputs.namespace }} $pod -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null || true); do
            kubectl logs -n ${{ inputs.namespace }} $pod -c $container > ${{ inputs.folder_name }}/pods/logs/$pod/$container.log 2>&1 || true
            kubectl logs -n ${{ inputs.namespace }} $pod -c $container --previous > ${{ inputs.folder_name }}/pods/logs/$pod/$container.previous.log 2>&1 || true
          done
        done

    - name: Describe Pods
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/pods/describe
        for pod in $(kubectl get pods -n ${{ inputs.namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
          kubectl describe pod -n ${{ inputs.namespace }} $pod > ${{ inputs.folder_name }}/pods/describe/$pod.txt 2>&1 || true
        done

    - name: PVC logs
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/pvc
        for p in $(kubectl get pvc -n ${{ inputs.namespace }} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true); do
          kubectl describe pvc -n ${{ inputs.namespace }} $p > ${{ inputs.folder_name }}/pvc/$p.txt 2>&1 || true
        done

    - name: PV logs
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/pv
        for p in $(kubectl get pvc -n ${{ inputs.namespace }} -o jsonpath='{.items[*].spec.volumeName}' 2>/dev/null || true); do
          kubectl describe pv $p > ${{ inputs.folder_name }}/pv/$p.txt 2>&1 || true
        done

    - name: CRDs definitions
      shell: bash
      run: kubectl get crd -A > ${{ inputs.folder_name }}/crds.txt 2>&1 || true

    - name: Print MGMd cluster.log
      shell: bash
      run: |
        mkdir -p ${{ inputs.folder_name }}/mgmd
        kubectl logs mgmds-0 --namespace ${{ inputs.namespace }} -c mgmd > ${{ inputs.folder_name }}/mgmd/mgmd.log 2>&1 || true
        kubectl logs mgmds-0 --namespace ${{ inputs.namespace }} -c mgmd --previous > ${{ inputs.folder_name }}/mgmd/mgmd.previous.log 2>&1 || true
        kubectl exec mgmds-0 --namespace ${{ inputs.namespace }} -c mgmd -- cat /srv/hops/mysql-cluster/log/cluster.log > ${{ inputs.folder_name }}/cluster.log 2>&1 || true

    - name: Save artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.folder_name }}
        path: ${{ inputs.folder_name }}
        if-no-files-found: error
