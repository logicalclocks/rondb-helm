{{- /*
  Rolls the data node groups one at a time on upgrade, so a bad change can
  only take down one group at a time instead of one pod in every group.

  templates/ndbd.yaml freezes each node-group StatefulSet (rolling-update
  partition set to the replica count), so `helm upgrade` records the new pod
  template but restarts nothing. This CronJob runs every few minutes; each
  run reads the current state of every group and takes one step: unfreeze at
  most one group that still needs the update (partition 0), and re-freeze any
  that has finished. The StatefulSet controller does the restarts, one pod at
  a time, held back by the pods' readiness probes.

  It keeps almost no state of its own — the partition value and the
  current/target revisions live on the StatefulSets, plus one annotation set
  here to time a stalled group — so a killed run, drained node, or cluster
  restart loses nothing; the next run continues. Working from current state
  also means `helm rollback` and changes made outside Helm are handled the
  same way, and a group unfrozen by hand is taken over and re-frozen.

  If a group doesn't finish within the stall timeout, the rollout stops there
  (no later group is unfrozen) and the group stays unfrozen — but note that
  any `helm upgrade`, including the one carrying a fix and even a re-apply
  of identical values, re-freezes every group: Helm's three-way merge
  restores the rendered partition over the live value. Delivering a fix to
  a broken group therefore depends on the unfreeze decision below, never on
  the group happening to still be unfrozen. Every run logs each group's
  state, so the newest pod log always shows why the rollout is paused; the
  durable "not progressing" signal is the revision-age metric alert.

  A pending update on a healthy group waits while any OTHER group is
  unhealthy, so the rollout never takes a second group down at the same
  time. A pending group that is itself unhealthy is NOT held back by its
  own sickness — a group broken by a bad build can only be repaired by the
  update it is waiting for, so holding it on its own account would deadlock
  the rollout at exactly the moment a fix arrives. Such a group is
  preferred over lower healthy pending groups (rolling an already-degraded
  group adds no new exposure), but only when the update would replace its
  dead pod first: the walk mirrors the controller — highest ordinal first,
  stopping where the controller would wait (an updated-but-unavailable
  pod), with "unavailable" meaning the controller's own notion, a
  terminating pod included — so this never costs the group a live
  replica.

  Delivering the update is then left entirely to the StatefulSet
  controller, which deletes the highest-ordinal pod not on the update
  revision as soon as the group is unfrozen. That relies on one chart
  invariant worth stating: the node-group StatefulSets use
  `podManagementPolicy: Parallel`. Under `OrderedReady` the controller
  returns early on any pod that is terminating or not Running+Ready and
  never reaches that deletion at all — the documented "forced rollback"
  case, where the bad pod has to be deleted by hand. See
  docs/data_node_upgrade_ordering.md for the one controller version where
  unfreezing alone is not enough (Kubernetes 1.35.0 with
  MaxUnavailableStatefulSet enabled) and the manual step it needs.

  Once everything is converged and frozen, the run suspends its own CronJob
  so nothing at all runs while idle. `.spec.suspend` is deliberately NOT
  templated: under server-side apply (Helm 4's default) a field the chart
  declares AND the run mutates has two owners, and Helm's Apply then
  conflicts with the run's patch (a patch is an Update, distinct from an
  Apply even under the same manager name, so it can't be worked around by
  matching field managers). Leaving suspend off the manifest means Helm
  never owns it, so the run may set it freely; a post-upgrade/-rollback Helm
  hook Job (see the bottom of this file) re-enables the CronJob on the next
  helm operation.

  Self-suspend and its wake hook are active only when Helm drives the apply
  (mode auto/unset; see suspendWhenIdleActive). Under Argo (mode set) both
  are off: the CronJob stays scheduled and no-ops when idle, so nothing ever
  writes .spec.suspend and there is no conflict — the hook is not rendered in
  that mode (Argo would otherwise map it onto a PostSync job). A change
  applied while suspended can be woken by hand:
  kubectl patch cronjob rondb-ndbmtd-sequenced-rollout --type merge \
    -p '{"spec":{"suspend":false}}'

  Argo CD: an unfrozen group differs from the partition Helm rendered, so
  with selfHeal on, set ignoreDifferences for
  .spec.updateStrategy.rollingUpdate.partition on node-group-* StatefulSets.
  partition IS templated (it must be, to freeze on install), but at rest its
  value equals the render, so only a `helm upgrade` DURING an active rollout
  conflicts under SSA; pass --force-conflicts for that rare case.
*/}}

{{- if include "rondb.ndbmtdSequencedRollout.isActive" . }}
{{- $stallTimeoutMinutes := include "rondb.ndbmtdSequencedRollout.perGroupStallTimeoutMinutes" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rondb-ndbmtd-sequenced-rollout
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rondb-ndbmtd-sequenced-rollout
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  # patch: sets both the partition value and this job's annotations.
  verbs: ["get", "patch"]
  resourceNames:
  {{- range $g := until (int .Values.clusterSize.numNodeGroups) }}
  - node-group-{{ $g }}
  {{- end }}
# list: pod tables for stall logging ("list" can't be limited to names).
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
# get only on the data-node pods themselves: the unfreeze safety check
# reads each one to work out what the controller would delete first.
# StatefulSet pod names are stable and enumerable at render time, so the
# grant does not extend to any other pod in the namespace — tighter than
# the unscoped "get" this chart granted before.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
  resourceNames:
  {{- range $g := until (int .Values.clusterSize.numNodeGroups) }}
  {{- range $r := until (int $.Values.clusterSize.activeDataReplicas) }}
  - node-group-{{ $g }}-{{ $r }}
  {{- end }}
  {{- end }}
# The CronJob suspends itself while idle and resumes when work appears.
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "patch"]
  resourceNames:
  - rondb-ndbmtd-sequenced-rollout
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rondb-ndbmtd-sequenced-rollout
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: rondb-ndbmtd-sequenced-rollout
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: rondb-ndbmtd-sequenced-rollout
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rondb-ndbmtd-sequenced-rollout
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "*/{{ int .Values.ndbmtdSequencedRollout.reconcileIntervalMinutes }} * * * *"
  # .spec.suspend is intentionally NOT set here. The reconcile run toggles it
  # at runtime; templating it too would give the field two writers and make
  # `helm upgrade` fail with a server-side-apply conflict. Helm leaves the
  # field alone; the wake-hook Job at the bottom of this file re-enables the
  # CronJob after each helm operation. See the header comment for the full
  # rationale. New CronJobs default to suspend=false, so a fresh install runs.
  # Each run is short and repeatable; never run two at once.
  concurrencyPolicy: Forbid
  # Without a deadline, an outage that misses more than 100 scheduled runs
  # stops the CronJob for good. This caps the miss count so it recovers.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # A run is only a few kubectl calls; this is a safety cap.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            rondbService: ndbmtd-sequenced-rollout
        spec:
          serviceAccountName: rondb-ndbmtd-sequenced-rollout
          restartPolicy: Never
{{- include "rondb.PodSecurityContext" $ | indent 10 }}
{{- include "rondb.imagePullSecrets" . | indent 10 }}
{{- include "rondb.nodeSelector" (dict "nodeSelector" .Values.nodeSelector.mgmd) | indent 10 }}
{{- include "rondb.tolerations" (dict "tolerations" .Values.tolerations.mgmd) | indent 10 }}
{{- if .Values.priorityClass }}
          priorityClassName: {{ .Values.priorityClass | quote }}
{{- end }}
          containers:
          - name: reconcile
            image: {{ include "image_address" (dict "image" .Values.images.toolbox) }}
            imagePullPolicy: {{ .Values.imagePullPolicy }}
{{ include "rondb.ContainerSecurityContext" $ | indent 12 }}
            resources:
              limits:
                cpu: 0.2
                memory: 200Mi
            env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: NUM_NODE_GROUPS
              value: {{ .Values.clusterSize.numNodeGroups | quote }}
            - name: STALL_TIMEOUT_MINUTES
              value: {{ $stallTimeoutMinutes | quote }}
            - name: CRONJOB_NAME
              value: rondb-ndbmtd-sequenced-rollout
            - name: SUSPEND_WHEN_IDLE
{{- if include "rondb.ndbmtdSequencedRollout.suspendWhenIdleActive" . }}
              value: "true"
{{- else }}
              value: "false"
{{- end }}
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              log() { echo "[sequenced-rollout] $*"; }

              UNFROZE_AT_KEY="rondb.hopsworks.ai/sequenced-rollout-unfroze-at"
              STALL_SECONDS=$((STALL_TIMEOUT_MINUTES * 60))
              NOW=$(date +%s)
              # Time-bound every kubectl call so one hung connection can't
              # use up the whole run. Do not use kubectl's --request-timeout
              # here: with no kubeconfig, that override makes client-go treat
              # its localhost default as explicit and skip in-cluster auth.
              kube() {
                timeout 15s kubectl -n "$NAMESPACE" "$@"
              }

              get_field() { # <sts> <jsonpath>
                kube get statefulset "$1" -o jsonpath="$2"
              }

              set_partition() { # <sts> <value>
                kube patch statefulset "$1" --type merge \
                  -p "{\"spec\":{\"updateStrategy\":{\"type\":\"RollingUpdate\",\"rollingUpdate\":{\"partition\":$2}}}}"
              }

              set_suspend() { # <true|false>
                # Plain patch (an Update): the chart does not template
                # .spec.suspend, so Helm's Apply never owns it and this write
                # can't collide with Helm. The wake hook re-enables the
                # CronJob with the same kind of patch. See the header comment.
                kube patch cronjob "$CRONJOB_NAME" --type merge \
                  -p "{\"spec\":{\"suspend\":$1}}"
              }

              ensure_awake() {
                # A run started by hand while the CronJob is suspended
                # (kubectl create job --from=...) that finds work must
                # resume the schedule, or nothing follows up on it.
                [[ "$SUSPEND_WHEN_IDLE" != "true" ]] && return 0
                local suspended
                suspended=$(kube get cronjob "$CRONJOB_NAME" -o jsonpath='{.spec.suspend}' 2>/dev/null) || return 0
                [[ "$suspended" != "true" ]] && return 0
                log "work found while suspended; resuming the schedule"
                set_suspend false >/dev/null || log "WARN: could not resume own schedule"
              }

              update_replaces_dead_pod() { # <group-index> <replicas> <update-revision>
                # Unfreezing tells the StatefulSet controller to delete the
                # highest-ordinal pod that is not on the update revision. For
                # an unhealthy group that is only safe when that pod is itself
                # the dead one: deleting it costs nothing and its replacement
                # carries the update. If it is alive while another pod of the
                # group is down, deleting it would remove a live replica from
                # an already degraded group. Walk the ordinals the way the
                # controller does and check what it would delete first.
                #
                # The walk runs down to ordinal 0 because that is the partition
                # unfreezing sets, and the controller never updates an ordinal
                # below the partition.
                # Availability everywhere below means the controller's own
                # notion: Ready AND not terminating — a pod with a deletion
                # timestamp counts as unavailable even while its Ready
                # condition is still True (isRunningAndAvailable). The chart
                # sets no minReadySeconds, so no extra availability term
                # exists.
                local g=$1 replicas=$2 update=$3 ord pod state term rev ready
                for ((ord = replicas - 1; ord >= 0; ord--)); do
                  pod="node-group-$g-$ord"
                  if ! state=$(kube get pod "$pod" -o jsonpath='{.metadata.deletionTimestamp}{"|"}{.metadata.labels.controller-revision-hash}{"|"}{.status.conditions[?(@.type=="Ready")].status}' 2>&1); then
                    if [[ "$state" == *"(NotFound)"* || "$state" == *"not found"* ]]; then
                      # Pod object gone: it is recreated (at partition 0, on
                      # the update revision), not deleted — no live replica is
                      # lost by unfreezing.
                      return 0
                    fi
                    # Any other failure: fail closed. Assuming "gone" on a
                    # timeout or auth error could green-light deleting the
                    # group's only live replica.
                    log "ERROR: could not read pod $pod: $state"
                    exit 1
                  fi
                  IFS='|' read -r term rev ready <<< "$state"
                  if [[ "$rev" != "$update" ]]; then
                    # This is the pod the controller deletes first. Unfreezing
                    # is safe only if it is unavailable — deleting it then
                    # costs nothing. If it is available, unfreezing would
                    # sacrifice a live replica of a degraded group: hold.
                    if [[ "$ready" != "True" || -n "$term" ]]; then
                      return 0
                    else
                      return 1
                    fi
                  fi
                  # Already on the update revision. If it is unavailable the
                  # controller waits HERE and touches nothing below it (the
                  # classic path returns at the first unavailable pod, the
                  # MaxUnavailableStatefulSet path deletes nothing while any
                  # pod is unavailable) — so stop exactly where it stops.
                  # Walking on and deleting a lower old-revision pod would
                  # diverge from the controller: it could remove a pod that
                  # was about to recover on the still-working revision, or —
                  # through the read-to-delete gap — one that already had.
                  if [[ "$ready" != "True" || -n "$term" ]]; then
                    return 1
                  fi
                  # Updated and available: never deleted; keep walking.
                done
                return 1  # every pod already updated; nothing to replace
              }

              log "run: groups=$NUM_NODE_GROUPS stallTimeout=${STALL_TIMEOUT_MINUTES}m"

              # A pod with a deletion timestamp counts as unavailable to the
              # rolling update even while its Ready condition is still True —
              # but status.readyReplicas (and availableReplicas) still count
              # it, so a group can look healthy in the StatefulSet status
              # while the controller sees it as degraded. One list call finds
              # every terminating data pod; its group is treated as unhealthy
              # for this run's decisions. Fail closed like the StatefulSet
              # reads: an unknown answer could let two groups degrade at once.
              terminating_groups=""
              if ! _term_out=$(kube get pods -l nodeGroup -o jsonpath='{range .items[?(@.metadata.deletionTimestamp)]}{.metadata.labels.nodeGroup}{"\n"}{end}' 2>&1); then
                log "ERROR: could not list terminating pods: $_term_out"
                exit 1
              fi
              while IFS= read -r _tg; do
                [[ "$_tg" =~ ^[0-9]+$ ]] && terminating_groups="$terminating_groups node-group-$_tg"
              done <<< "$_term_out"
              [[ -n "$terminating_groups" ]] && log "groups with terminating pods (counted unhealthy):$terminating_groups"

              rolling_sts=""       # unfrozen group still updating (rollout in progress)
              lowest_pending=""    # lowest frozen group with a pending update
              lowest_pending_unhealthy=""  # ... of those, the lowest that is itself unhealthy
              lpu_group=""; lpu_replicas=""; lpu_update=""
              unhealthy_groups=""  # names, so a hold can say who is actually blocking

              for ((g = 0; g < NUM_NODE_GROUPS; g++)); do
                sts="node-group-$g"
                if ! state=$(get_field "$sts" '{.spec.replicas}{"|"}{.spec.updateStrategy.rollingUpdate.partition}{"|"}{.status.currentRevision}{"|"}{.status.updateRevision}{"|"}{.status.readyReplicas}' 2>&1); then
                  if [[ "$state" == *"(NotFound)"* || "$state" == *"not found"* ]]; then
                    log "$sts not found; skipping"
                    continue
                  fi
                  log "ERROR: could not read $sts: $state"
                  exit 1
                fi
                IFS='|' read -r replicas partition current update ready <<< "$state"
                replicas=${replicas:-0}; partition=${partition:-0}; ready=${ready:-0}

                if [[ -z "$current" || -z "$update" ]]; then
                  log "$sts has no revision status yet; skipping this run"
                  continue
                fi

                pending=false; [[ "$current" != "$update" ]] && pending=true
                frozen=false;  [[ "$partition" -ge "$replicas" ]] && frozen=true
                healthy=false; [[ "$ready" -eq "$replicas" ]] && healthy=true
                [[ " $terminating_groups " == *" $sts "* ]] && healthy=false

                [[ "$healthy" == false ]] && unhealthy_groups="$unhealthy_groups $sts"

                if [[ "$frozen" == true ]]; then
                  if [[ "$pending" == true && -z "$lowest_pending" ]]; then
                    lowest_pending="$sts"
                  fi
                  if [[ "$pending" == true && "$healthy" == false && -z "$lowest_pending_unhealthy" ]]; then
                    lowest_pending_unhealthy="$sts"
                    lpu_group="$g"; lpu_replicas="$replicas"; lpu_update="$update"
                  fi
                  continue
                fi

                # --- group is unfrozen ---
                if [[ "$pending" == false && "$healthy" == true ]]; then
                  # Finished: re-freeze so it matches what Helm rendered, and
                  # clear this job's annotation.
                  log "$sts converged on revision $update; re-freezing (partition=$replicas)"
                  set_partition "$sts" "$replicas"
                  kube annotate statefulset "$sts" \
                    "${UNFROZE_AT_KEY}-" --overwrite >/dev/null 2>&1 || true
                  continue
                fi

                # Still updating (or updated but not yet ready). Only one
                # group may be unfrozen at a time, so don't unfreeze another.
                if [[ -n "$rolling_sts" ]]; then
                  log "WARN: multiple unfrozen groups ($rolling_sts, $sts) — manual change? holding the rollout"
                  continue
                fi
                rolling_sts="$sts"

                if ! unfroze_at=$(get_field "$sts" "{.metadata.annotations['rondb\.hopsworks\.ai/sequenced-rollout-unfroze-at']}" 2>&1); then
                  log "ERROR: could not read $sts rollout annotation: $unfroze_at"
                  exit 1
                fi
                if ! [[ "$unfroze_at" =~ ^[0-9]+$ ]]; then
                  # Unfrozen by hand or by an earlier interrupted run (or the
                  # annotation is invalid): take it over and start the timer.
                  log "$sts is unfrozen without a valid start-time annotation; taking it over"
                  kube annotate statefulset "$sts" \
                    "${UNFROZE_AT_KEY}=${NOW}" --overwrite >/dev/null || true
                  unfroze_at=$NOW
                fi

                age=$((NOW - unfroze_at))
                if (( age > STALL_SECONDS )); then
                  log "STALL: $sts unconverged for ${age}s (> ${STALL_SECONDS}s); rollout paused until it finishes or a new update lands"
                  kube get pods -l nodeGroup="$g" -o wide || true
                else
                  log "$sts rolling for ${age}s (stall threshold ${STALL_SECONDS}s)"
                fi
              done

              if [[ -n "$rolling_sts" ]]; then
                ensure_awake
                log "rollout in progress on $rolling_sts; nothing else this run"
                exit 0
              fi

              if [[ -n "$lowest_pending" ]]; then
                ensure_awake
                # Prefer a pending group that is already unhealthy: rolling it
                # degrades nothing further, and when its sickness comes from a
                # bad build the pending update is the repair. Holding such a
                # group on account of its OWN sickness would deadlock the
                # rollout at exactly the moment a fix arrives — nothing but
                # the update it is being denied can make it healthy again.
                target="$lowest_pending"
                [[ -n "$lowest_pending_unhealthy" ]] && target="$lowest_pending_unhealthy"
                blockers=""
                for u in $unhealthy_groups; do
                  [[ "$u" != "$target" ]] && blockers="$blockers $u"
                done
                if [[ -n "$blockers" ]]; then
                  # Never degrade a second group while one is already down —
                  # and name the groups actually failing the health check.
                  log "pending update on $target held: unhealthy:$blockers"
                  exit 0
                fi
                if [[ -n "$lowest_pending_unhealthy" ]] && \
                   ! update_replaces_dead_pod "$lpu_group" "$lpu_replicas" "$lpu_update"; then
                  log "pending update on $target held: the group is unhealthy and the update would not replace its dead pod first"
                  exit 0
                fi
                log "unfreezing $target (partition=0)"
                kube annotate statefulset "$target" \
                  "${UNFROZE_AT_KEY}=${NOW}" --overwrite >/dev/null
                set_partition "$target" 0
                exit 0
              fi

              if [[ "$SUSPEND_WHEN_IDLE" == "true" ]]; then
                log "nothing to do; suspending until the next helm upgrade or rollback"
                set_suspend true >/dev/null || log "WARN: could not suspend own schedule"
              else
                log "nothing to do"
              fi
{{- if include "rondb.ndbmtdSequencedRollout.suspendWhenIdleActive" . }}
---
# Wakes the (possibly self-suspended) CronJob after every helm upgrade or
# rollback, replacing the old approach of templating `suspend: false` and
# letting Helm reset it — which conflicts under server-side apply. This is a
# post-* hook so it runs after the CronJob object is applied. Rendered only
# when self-suspend is active; under Argo (mode set) it is absent, and Argo
# would otherwise translate these hook annotations into a PostSync job.
apiVersion: batch/v1
kind: Job
metadata:
  name: rondb-ndbmtd-sequenced-rollout-wake
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-upgrade,post-rollback
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # A single patch call; cap it so a stuck run can't linger.
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        rondbService: ndbmtd-sequenced-rollout-wake
    spec:
      serviceAccountName: rondb-ndbmtd-sequenced-rollout
      restartPolicy: Never
{{- include "rondb.PodSecurityContext" $ | indent 6 }}
{{- include "rondb.imagePullSecrets" . | indent 6 }}
{{- include "rondb.nodeSelector" (dict "nodeSelector" .Values.nodeSelector.mgmd) | indent 6 }}
{{- include "rondb.tolerations" (dict "tolerations" .Values.tolerations.mgmd) | indent 6 }}
{{- if .Values.priorityClass }}
      priorityClassName: {{ .Values.priorityClass | quote }}
{{- end }}
      containers:
      - name: wake
        image: {{ include "image_address" (dict "image" .Values.images.toolbox) }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
{{ include "rondb.ContainerSecurityContext" $ | indent 8 }}
        resources:
          limits:
            cpu: 0.2
            memory: 200Mi
        env:
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          # Plain merge patch (an Update); the chart does not template
          # .spec.suspend, so this never collides with Helm's apply.
          timeout 15s kubectl -n "$NAMESPACE" patch cronjob \
            rondb-ndbmtd-sequenced-rollout --type merge \
            -p '{"spec":{"suspend":false}}'
          echo "[sequenced-rollout-wake] CronJob resumed"
{{- end }}
{{- end }}
