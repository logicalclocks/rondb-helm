# Common service account for all RonDB node pods. Unlike the Kubernetes-owned
# namespace 'default' account, this one is chart-owned and can carry annotations
# (e.g. the AWS IRSA role-arn) via .Values.serviceAccountAnnotations, so the
# backup upload that runs inside the data-node pods can authenticate to object
# storage.
#
# Always rendered: some referencing pods (rdrs, mysqld_exporter, binlog servers,
# benchmark) are created even when RonDB is externally managed, so the account
# must exist unconditionally to avoid dangling serviceAccountName references.
#
# A hook, not a release resource. The mgmd pre-upgrade hook applies the MGMd
# StatefulSet during the pre-upgrade phase, before Helm applies the main
# manifest, and the new MGMd pod cannot be created until this account exists.
# Helm evaluates resource adoption before any hook runs, so the account cannot
# be created by a hook and also live in the main manifest; it has to be a hook
# itself. Weight -40 puts it ahead of every other hook in the chart.
#
# before-hook-creation is the only delete policy a persistent hook resource
# can use: hooks are created, never applied, so without it the next upgrade
# fails with AlreadyExists. Helm therefore deletes and recreates the account
# at the start of each upgrade. Running pods are unaffected, no pod on this
# account calls the Kubernetes API, and helm uninstall leaves it behind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rondb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-40"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- include "rondb.serviceAccountAnnotationEntries" $ }}
