# Enforces clusterSize.numNodeGroups immutability on upgrade — RonDB does
# not support online add/remove of node groups. Bypass with
# forceNodeGroupChange=true. Skipped on install and when
# rondb.isExternallyManaged.
#
# Dispatched by rondb.canUseLookupFunc:
#   - Lookup branch (mode auto/unset, default Helm CLI/Flux): counts
#     node-group-* StatefulSets via `lookup` and fails at render time.
#   - Job branch (mode upgrade, ArgoCD convention): renders
#     SA/Role/RB/Job as a pre-upgrade hook.

{{- if and (include "rondb.isUpgrade" .) (not (or (include "rondb.isExternallyManaged" .) .Values.forceNodeGroupChange)) }}
{{- if include "rondb.canUseLookupFunc" (dict "mode" .Values.mode "global" .Values.global) }}

{{- /* Lookup branch — synchronous fail at render time, no resources. */}}
{{- $expected := int .Values.clusterSize.numNodeGroups }}
{{- $stsList := lookup "apps/v1" "StatefulSet" .Release.Namespace "" }}
{{- $existing := 0 }}
{{- if $stsList }}
{{- range $sts := $stsList.items }}
{{- /* Name-only match: node-group-N StatefulSets have no metadata.labels
       (rondbService label is on the pod template, not the STS). */}}
{{- if regexMatch "^node-group-[0-9]+$" $sts.metadata.name }}
{{- $existing = add1 $existing }}
{{- end }}
{{- end }}
{{- end }}

{{- /* EXISTING=0 means lookup can't read cluster state (RBAC denial or
       template-only render). Otherwise existing must match. */}}
{{- if eq $existing 0 }}
{{- fail (printf "\n\nERROR: cannot read cluster state during upgrade.\nNo node-group-* StatefulSets visible in namespace %q.\nLikely missing `list statefulsets` RBAC, or template-only render without API access.\nFor ArgoCD/template-only upgrades, set mode: upgrade so the check runs as a Job at apply time.\n" .Release.Namespace) }}
{{- else if ne $existing $expected }}
{{- fail (printf "\n\nERROR: clusterSize.numNodeGroups is immutable (deployed=%d, requested=%d).\nRonDB does not support online add/remove of node groups — take a backup, then reinstall with the new topology and restoreFromBackup.backupId set to that backup.\nBypass: --set forceNodeGroupChange=true (DESTRUCTIVE).\n" $existing $expected) }}
{{- end }}

{{- else }}

{{- /* Job branch — pre-upgrade hook for ArgoCD. */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-rondb-topology-check
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook":               pre-upgrade
    "helm.sh/hook-weight":        "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- include "rondb.serviceAccountAnnotationEntries" $ }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-rondb-topology-check
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook":               pre-upgrade
    "helm.sh/hook-weight":        "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-rondb-topology-check
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook":               pre-upgrade
    "helm.sh/hook-weight":        "-30"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-rondb-topology-check
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-rondb-topology-check
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rondb-topology-check
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook":               pre-upgrade
    "helm.sh/hook-weight":        "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        rondbService: topology-check
    spec:
      serviceAccountName: {{ .Release.Name }}-rondb-topology-check
      restartPolicy: Never
{{- include "rondb.imagePullSecrets" $ | indent 6 }}
{{- include "rondb.PodSecurityContext" $ | indent 6 }}
{{- include "rondb.nodeSelector" (dict "nodeSelector" $.Values.nodeSelector.mgmd) | indent 6 }}
{{- include "rondb.tolerations" (dict "tolerations" $.Values.tolerations.mgmd) | indent 6 }}
      containers:
      - name: check
        image: {{ include "image_address" (dict "image" $.Values.images.toolbox) }}
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
{{- include "rondb.ContainerSecurityContext" $ | indent 8 }}
        resources:
          limits:
            cpu: 0.2
            memory: 200Mi
        env:
        - name: NS
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        - name: EXPECTED
          value: {{ .Values.clusterSize.numNodeGroups | quote }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail

          # Fail closed on kubectl error; an empty list would otherwise be
          # misread as "no prior topology" and let a destructive upgrade
          # proceed. No `-l` selector: node-group-N StatefulSets have no
          # metadata.labels — name regex below is the filter.
          if ! STS_NAMES=$(kubectl -n "$NS" get sts \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); then
            echo "ERROR: kubectl list failed — refusing sync" >&2
            exit 1
          fi
          EXISTING=$(printf '%s' "$STS_NAMES" | grep -cE '^node-group-[0-9]+$' || true)

          if [ "$EXISTING" -eq 0 ]; then
            echo "ERROR: upgrade but no node-group-* StatefulSets visible in $NS — manually deleted? refusing sync" >&2
            exit 1
          fi
          if [ "$EXISTING" -eq "$EXPECTED" ]; then
            echo "Topology check passed: $EXPECTED node group(s)"
            exit 0
          fi
          cat >&2 <<EOF
          ERROR: clusterSize.numNodeGroups is immutable (deployed=$EXISTING, requested=$EXPECTED).
          RonDB does not support online add/remove of node groups — take a backup, then reinstall with the new topology and restoreFromBackup.backupId set to that backup.
          Bypass: --set forceNodeGroupChange=true (DESTRUCTIVE).
          EOF
          exit 1
{{- end }}
{{- end }}
